map H jump-prev
map L jump-next
map J move-parent down
map K move-parent up
map zz z
map zi zi
map za zadd
map . set hidden!
map D delete
map X trash
map F filter
map gc cd ~/.config
map gd cd ~/dotfiles
map gD cd ~/Downloads
map gl cd ~/.local
map gp cd ~/Pictures
map gv cd ~/Videos
